name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        # with:
          # path: . # The root location of your Astro project inside the repository. (optional)
          # node-version: 20 # The specific version of Node that should be used to build your site. Defaults to 20. (optional)
          # package-manager: pnpm@latest # The Node package manager that should be used to install dependencies and build your site. Automatically detected based on your lockfile. (optional)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Pages is set to "Deploy from a branch", each push also publishes the raw repo, a 404 site:
      # deploy after it, or it can overwrite this one.
      - name: Wait for GitHub's branch publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type || true)" = "legacy" ] || exit 0
          for i in $(seq 1 30); do
            state=$(gh run list -R "$GITHUB_REPOSITORY" --workflow pages-build-deployment --commit "$GITHUB_SHA" --json status --jq '.[0].status' || true)
            [ "$state" = "completed" ] && exit 0
            sleep 10
          done
          echo "GitHub's branch publish still runs after 5 min: deploying anyway."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4